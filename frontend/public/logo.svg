<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDFB"/>
      <stop offset="100%" stop-color="#F5EFEA"/>
    </linearGradient>

    <!-- Warm Tone Accent Gradient -->
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B5B"/>
      <stop offset="100%" stop-color="#FF8E53"/>
    </linearGradient>

    <linearGradient id="warmGradHover" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E05244"/>
      <stop offset="100%" stop-color="#FF7A3D"/>
    </linearGradient>

    <!-- Dark Text / Secondary Element Color -->
    <solidColor id="slate" solid-color="#1A212D"/>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1A212D" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <g transform="translate(100, 125)">
    <!-- LOGO ICON / VECTOR EMBLEM -->
    <g transform="translate(0, 0)" filter="url(#softShadow)">
      <!-- Outer 360 Loop -->
      <path d="M 100 20 A 80 80 0 1 1 20 100" 
            fill="none" 
            stroke="url(#warmGrad)" 
            stroke-width="18" 
            stroke-linecap="round"/>
      
      <!-- Inner Dynamic Loop / 'P' Monogram Curve -->
      <path d="M 65 145 V 55 C 65 55 115 45 115 85 C 115 125 65 115 65 115" 
            fill="none" 
            stroke="#1A212D" 
            stroke-width="16" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Connected Orbit Nodes (360 Concept) -->
      <circle cx="100" cy="20" r="10" fill="url(#warmGrad)"/>
      <circle cx="140" cy="140" r="7" fill="#1A212D"/>
    </g>

    <!-- LOGO TEXT TYPOGRAPHY -->
    <g transform="translate(230, 115)">
      <!-- Main Brand Text: PeoplePay -->
      <text x="0" y="0" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
            font-size="64" 
            font-weight="800" 
            letter-spacing="-1.5" 
            fill="#1A212D">PeoplePay</text>
      
      <!-- Highlighted Text: 360 -->
      <text x="325" y="0" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
            font-size="64" 
            font-weight="900" 
            letter-spacing="-1" 
            fill="url(#warmGrad)">360</text>
      
      <!-- Subtitle/Tagline -->
      <text x="5" y="32" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
            font-size="14" 
            font-weight="600" 
            letter-spacing="4" 
            fill="#7E8B9B" 
            text-transform="uppercase">HR &amp; Payroll Solutions</text>
    </g>
  </g>
</svg>
