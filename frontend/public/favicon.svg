<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Soft Warm Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDFB"/>
      <stop offset="100%" stop-color="#F5EFEA"/>
    </linearGradient>

    <!-- Vibrant Warm Coral/Sunset Accent Gradient -->
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B5B"/>
      <stop offset="100%" stop-color="#FF8E53"/>
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1A212D" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Favicon Container Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Iconic 360 Loop & Integrated "P" Monogram -->
  <g transform="translate(106, 106)" filter="url(#softShadow)">
    <!-- 360-Degree Outer Warm Coral Ring Arc -->
    <path d="M 150 30 A 120 120 0 1 1 30 150" 
          fill="none" 
          stroke="url(#warmGrad)" 
          stroke-width="28" 
          stroke-linecap="round"/>

    <!-- Central Overlapping Deep Slate "P" Monogram -->
    <path d="M 100 220 V 80 C 100 80 175 65 175 125 C 175 185 100 170 100 170" 
          fill="none" 
          stroke="#1A212D" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- 360 Orbit Nodes -->
    <circle cx="150" cy="30" r="15" fill="url(#warmGrad)"/>
    <circle cx="210" cy="210" r="11" fill="#1A212D"/>
  </g>
</svg>
